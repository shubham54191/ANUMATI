# ANUMATI — the whole stack on one machine.
#
#   cp .env.example .env        # then change JWT_SECRET and the passwords
#   docker compose up --build   # web on :3000, API on :4000
#   docker compose --profile extraction up ollama   # optional, for the rule pipeline
#
# The defaults run the DEMO configuration: seeded demo accounts and files,
# recorded government answers, and a labelled demo signer. The server refuses
# DEMO_MODE and DSC_MODE=demo when NODE_ENV=production, so a demo stack can
# never be mistaken for a deployment. See anumati-server/README.md.

name: anumati

x-server-env: &server-env
  NODE_ENV: ${ANUMATI_NODE_ENV:-development}
  DATABASE_URL: postgres://${POSTGRES_USER:-anumati}:${POSTGRES_PASSWORD:-anumati}@postgres:5432/${POSTGRES_DB:-anumati}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
  DEMO_MODE: ${DEMO_MODE:-true}
  ADAPTER_MODE: ${ADAPTER_MODE:-fixture}
  DSC_MODE: ${DSC_MODE:-demo}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  EXTRACTION_TOKEN: ${EXTRACTION_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DOCUMENT_STORE_DIR: /var/lib/anumati/documents

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anumati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anumati}
      POSTGRES_DB: ${POSTGRES_DB:-anumati}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anumati} -d ${POSTGRES_DB:-anumati}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: anumati-server/Dockerfile
    image: anumati-server:local
    restart: unless-stopped
    environment: *server-env
    ports:
      - "4000:4000"
    volumes:
      - documents:/var/lib/anumati/documents
    depends_on:
      postgres:
        condition: service_healthy

  # Same image, different process: deliveries, registry checks, the SLA
  # sentinel and the daily ledger anchor. A slow department system holds up
  # this queue, never a request.
  worker:
    build:
      context: .
      dockerfile: anumati-server/Dockerfile
    image: anumati-server:local
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *server-env
    volumes:
      - documents:/var/lib/anumati/documents
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: anumati-web/Dockerfile
      args:
        # The browser calls this URL, so it must be reachable from the browser.
        NEXT_PUBLIC_ANUMATI_API: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Optional: a local model for the offline rule-extraction pipeline. Never in
  # a request path — drafts it produces still need a person to publish them.
  ollama:
    image: ollama/ollama:latest
    profiles: ["extraction"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  documents:
  ollama:
