name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anumati-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anumati-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Both builds must compile: the offline demo and live mode.
      - run: npm run build
      - run: npm run build
        env:
          NEXT_PUBLIC_ANUMATI_API: http://localhost:4000

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anumati
          POSTGRES_PASSWORD: anumati
          POSTGRES_DB: anumati_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anumati -d anumati_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: anumati-server
    env:
      TEST_DATABASE_URL: postgres://anumati:anumati@localhost:5432/anumati_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anumati-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  extraction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anumati-extraction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  images:
    runs-on: ubuntu-latest
    needs: [web, server]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f anumati-server/Dockerfile -t anumati-server:ci .
      - run: docker build -f anumati-web/Dockerfile --build-arg NEXT_PUBLIC_ANUMATI_API=http://localhost:4000 -t anumati-web:ci .
